<style>
  :root {
    --bg: #f6f2ea;
    --panel: #ffffff;
    --panel-2: #f2e2c9;
    --text: #1f2f44;
    --muted: #5f6e80;
    --primary: #1769aa;
    --primary-dark: #0e4f81;
    --success: #0e7a5a;
    --warn: #91510f;
    --danger: #a73b3b;
    --max-width: 980px;
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Verdana', 'Gill Sans', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #f8f4ee 0%, #efdcc3 100%);
    color: var(--text);
    line-height: 1.4;
  }

  .app-shell {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 14px;
  }

  .screen {
    background: var(--panel);
    border: 1px solid #ead7b6;
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 8px 24px rgba(33, 46, 68, 0.12);
    margin-bottom: 12px;
  }

  h1,
  h2,
  h3 {
    margin: 0 0 12px 0;
  }

  .muted {
    color: var(--muted);
  }

  .top-note {
    background: #f6f1e6;
    border-left: 4px solid var(--warn);
    padding: 10px;
    border-radius: 6px;
  }

  .field {
    display: grid;
    gap: 8px;
    margin: 14px 0;
  }

  label {
    font-weight: 700;
  }

  input,
  select {
    font-size: 1.15rem;
    border: 2px solid #d9c39a;
    padding: 12px;
    border-radius: 8px;
  }

  button {
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin: 4px 0;
    width: 100%;
    background: var(--primary);
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  button.secondary {
    background: #5b7694;
  }

  button.warn {
    background: var(--warn);
  }

  button.ghost {
    background: #ebedf0;
    color: var(--text);
    border: 2px solid #c5d3df;
  }

  button.success {
    background: var(--success);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }

  .pill {
    padding: 8px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    font-weight: 700;
    font-size: 0.95rem;
  }

  .hint {
    color: var(--primary-dark);
    font-weight: 700;
  }

  .feedback {
    min-height: 36px;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
  }

  .feedback.ok {
    color: var(--success);
    background: #e2f3ea;
    border: 1px solid #a4dfc6;
  }

  .feedback.bad {
    color: var(--danger);
    background: #f7e3e3;
    border: 1px solid #e3bbbb;
  }

  .pill-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 12px 0;
  }

  .base-row,
  .codon-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-top: 8px;
  }

  .big {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .chain-area,
  .sequence-display {
    font-size: 1.25rem;
    padding: 12px;
    border-radius: 8px;
    background: #f5f7fb;
    border: 2px solid #d5dfee;
    margin: 6px 0 12px;
    min-height: 48px;
  }

  .slot-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .slot {
    min-width: 44px;
    min-height: 44px;
    padding: 10px;
    background: #edf2f7;
    border: 2px solid #d0deea;
    border-radius: 8px;
    text-align: center;
    font-weight: 700;
  }

  .codon-wheel-btn {
    width: auto;
    display: inline-block;
    margin: 0 0 12px;
    padding: 10px 16px;
  }

  .codon-list {
    display: grid;
    gap: 10px;
  }

  .codon-cell {
    border: 1px solid #d8c49f;
    border-radius: 8px;
    background: #fff;
    padding: 8px;
  }

  .codon-cell .codon {
    font-family: 'Courier New', Courier, monospace;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .translation-columns {
    margin-top: 12px;
  }

  .codon-block {
    border: 1px solid #d7e1ec;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    background: #f8fbff;
  }

  .codon-title {
    margin-bottom: 8px;
    font-weight: 700;
  }

  .trait-option {
    text-align: left;
    background: #f3f7fa;
    color: var(--text);
  }

  dialog {
    border: none;
    border-radius: 12px;
    padding: 0;
  }

  .codon-modal-content {
    width: min(640px, 94vw);
    background: #fff;
    border: 1px solid #cdd9e8;
    border-radius: 12px;
    padding: 14px;
  }

  .codon-modal-content header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .codon-modal-content button {
    width: auto;
    padding: 10px 12px;
  }

  .sequence-chip {
    border-radius: 999px;
    background: #edf4e8;
    border: 1px solid #bdd1b4;
    padding: 8px 10px;
    margin: 0 8px 8px 0;
    display: inline-block;
  }

  @media (min-width: 768px) {
    .screen {
      padding: 22px;
    }

    .pill-row {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
</style>
